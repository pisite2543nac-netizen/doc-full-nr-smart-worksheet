name: Deploy V5 Full UXUI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v5-full-ui/**'
      - '.github/workflows/deploy-v5-full-ui.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package
        run: |
          test -f v5-full-ui/index.html
          test -f v5-full-ui/styles.css
          test -f v5-full-ui/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: v5-full-ui
      - id: deployment
        uses: actions/deploy-pages@v4
