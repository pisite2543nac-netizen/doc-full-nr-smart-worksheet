<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071222" />
  <title>DOC-FULL-NR Smart Worksheet</title>
  <meta http-equiv="refresh" content="2;url=https://doc-full-nr.web.app/" />
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Segoe UI,Tahoma,sans-serif;color:#eef4ff;background:radial-gradient(circle at 50% 0,#15315c 0,#071222 42%,#040a13 100%)}
    .card{width:min(580px,100%);padding:34px;border:1px solid #294364;border-radius:22px;background:rgba(11,25,44,.94);box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center}.mark{width:70px;height:70px;margin:0 auto 18px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(145deg,#4a82f7,#2659c4);font-weight:900;font-size:24px}.eyebrow{color:#73a0ff;font-size:11px;font-weight:800;letter-spacing:.14em}.muted{color:#9aabc2;line-height:1.7}.btn{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:11px;background:#3973ed;color:#fff;text-decoration:none;font-weight:700}.small{margin-top:18px;color:#72849e;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">NR</div>
    <div class="eyebrow">DOC-FULL-NR</div>
    <h1>Smart Worksheet System</h1>
    <p class="muted">กำลังเปิดระบบใช้งานจริงบน Firebase Hosting เพื่อให้ Authentication, Firestore และ Routing ทำงานครบถ้วน</p>
    <a class="btn" href="https://doc-full-nr.web.app/">เข้าสู่ระบบ DOC-FULL-NR</a>
    <div class="small">GitHub ใช้สำหรับ Source Code / Backup / Version Control</div>
  </main>
  <script>setTimeout(()=>location.replace('https://doc-full-nr.web.app/'),1200)</script>
</body>
</html>
